<body class="app-shell">

<!-- Mount contract for the surface orders. This document is written once, by the
     shell order, and NO LATER ORDER EDITS IT (SPEC § 3.2) — a file left out of
     the tag list below is unreachable for the rest of the build.

       #surface          the router's host, and the only node it owns. Every
                         surface mounts here through mount(host, params) and is
                         emptied out of here on teardown (SPEC § 3.4).
       [data-app-live]   the app's ONE aria-live="polite" region. The router
                         announces each surface's title in it; app.notice
                         announces a degraded condition in the same one.
       [data-app-notice] LENZLI.app.notice(text)'s single line. Hidden until
                         something has to be said.
       [data-mark]       filled by mark.js at load; the value is the pixel size.
       [data-wordmark]   filled by mark.js at load.
       [data-app-nav]    the four-button nav. app.js hides it whole on #/r/<id>,
                         where demo chrome is stripped (§ 3.4.1 M6).
       [data-app-route]  the route that button navigates to, through router.go.
       [data-app-surface] the surface name that route resolves to; app.js moves
                         aria-current="page" to the button that matches.
       [data-app-about]  the About control. It calls LENZLI.openAbout(); the
                         About surface itself is loaded unedited (A1-24).

     THE DISCLOSURE LINE AT THE FOOT IS PERMANENT (F-6, A1-24). It is markup, not
     a surface's job, so the prototype states that its people are invented on
     every route and at every width, whether or not anyone opens About.

     THE ONLY INLINE CALL ON THIS PAGE IS LENZLI.appBoot(), at the very bottom.
     The reel shell's own entry point is never invoked here (A1-3, A1-7): that
     one is reel.html's, and it is the single thing that creates deck instance
     zero, which the app must not have. Its name is deliberately not written out
     anywhere in this document, so a grep for it over this file returns nothing.
-->

<header class="app-head">
  <span class="lockup">
    <span data-mark="26"></span>
    <span data-wordmark></span>
  </span>

  <nav class="app-nav" aria-label="App" data-app-nav>
    <button type="button" class="ctl app-tab" data-app-route="/" data-app-surface="browse">Search</button>
    <button type="button" class="ctl app-tab" data-app-route="/create" data-app-surface="create">Create</button>
    <button type="button" class="ctl app-tab" data-app-route="/me" data-app-surface="owner">My profile</button>
    <button type="button" class="ctl app-tab" data-app-about>About</button>
  </nav>
</header>

<p class="app-notice" data-app-notice hidden></p>

<div class="sr-only" data-app-live aria-live="polite" aria-atomic="true"></div>

<main class="app-surface" id="surface"></main>

<p class="app-disclosure">Prototype. Invented people, mock data, no network.</p>
